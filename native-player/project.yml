name: HimusicPlayer
options:
  bundleIdPrefix: com.himusic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  HimusicPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/HimusicPlayer
    info:
      path: Sources/HimusicPlayer/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.himusic.player
        PRODUCT_NAME: HimusicPlayer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
